<title>Ingressos Prada 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: magazine spread — white paper, black ink, one stiletto red; hero = kinetic Didone title + layered photo stack with flashbulbs; booking below as a 2-column order form */
:root{
  color-scheme:light;
  --paper:#ffffff;      /* poster white */
  --paper-2:#f5f2f1;    /* recessed fields */
  --ink:#111010;        /* type, masthead black */
  --grey:#6b6566;       /* secondary text, 5.7:1 on paper */
  --line:#e2dcdb;       /* rules */
  --red:#c4161c;        /* the stiletto red, 6.2:1 on paper */
  --red-deep:#94090f;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --sans:Jost,"Futura","Century Gothic",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font:400 16px/1.6 var(--sans);padding-inline:16px;overflow-x:hidden}
.wrap{max-width:1240px;margin-inline:auto}
:where(button,a,label,input):focus-visible{outline:2px solid var(--red);outline-offset:3px}
.label{font:500 12px/16px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--grey);margin:0}
.num{font-variant-numeric:tabular-nums lining-nums}

/* nav + ticker */
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;flex-wrap:wrap}
.brand{font:italic 600 24px/1 var(--display);letter-spacing:-.01em}
.nav nav{display:flex;gap:28px;font:500 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.nav a{color:var(--ink);text-decoration:none;position:relative}
.nav nav a::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:1px;background:var(--red);transition:right .35s var(--ease)}
.nav nav a:hover::after{right:0}
.ticker{border-block:1px solid var(--ink);overflow:hidden;white-space:nowrap;margin-inline:-16px}
.ticker div{display:inline-flex;gap:48px;padding-block:10px;animation:tick 38s linear infinite;font:500 13px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.ticker span::before{content:"✕";color:var(--red);margin-right:48px;font-size:10px}
@keyframes tick{to{transform:translateX(-50%)}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:56px 72px}
.title{margin:18px 0 22px;font:400 clamp(52px,8.6vw,118px)/.9 var(--display);font-variation-settings:"opsz" 96;letter-spacing:-.025em;text-wrap:balance}
.title .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.18em}
.title .ch{display:inline-block;transform:translateY(0);transition:transform .9s var(--ease),opacity .9s var(--ease)}
.title.pre .ch{transform:translateY(110%);opacity:0}
.title em{color:var(--red);font-style:italic}
.lead{max-width:44ch;margin:0 0 26px;font-size:18px;line-height:1.6;color:#2b2828}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 30px;padding:0;list-style:none;font:500 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.facts li+li::before{content:"/";color:var(--red);margin-right:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 26px;border:1px solid var(--ink);border-radius:0;font:500 13px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;text-decoration:none;background:var(--paper);color:var(--ink);isolation:isolate;transition:color .35s var(--ease)}
.btn::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .45s var(--ease);z-index:-1}
.btn:hover{color:var(--paper)}
.btn:hover::before{transform:none}
.btn--red{background:var(--red);border-color:var(--red);color:#fff}
.btn--red::before{background:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled::before{display:none}

/* stack */
.stack{position:relative;aspect-ratio:1/1.02;max-width:100%;touch-action:pan-y}
.layer{position:absolute;overflow:hidden;will-change:transform;
  transform:translate3d(calc(var(--sx,0)*var(--d)*1px),calc(var(--sy,0)*var(--d)*1px),0) rotate(var(--r,0deg)) rotateX(calc(var(--sy,0)*-6deg)) rotateY(calc(var(--sx,0)*6deg))}
.layer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.l-back{inset:0 22% 20% 0;--d:-14;background:var(--ink);color:#fff}
.l-num{right:0;top:2%;--d:26;font:italic 700 clamp(200px,30vw,380px)/.8 var(--display);color:var(--red);pointer-events:none;overflow:visible;z-index:2}
.l-mid{inset:30% 4% 4% 36%;--d:16;--r:1.5deg;background:var(--red);color:#fff;box-shadow:0 30px 60px -20px rgba(17,16,16,.45);z-index:3}
.l-front{width:30%;aspect-ratio:4/5;left:6%;bottom:0;--d:34;--r:-6deg;background:#fff;border:10px solid #fff;border-bottom-width:38px;box-shadow:0 24px 50px -16px rgba(17,16,16,.5);z-index:4}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:22px}
.mast{font:400 clamp(42px,6.4vw,84px)/.85 var(--display);letter-spacing:-.02em}
.l-mid .ph b{font:italic 400 clamp(30px,4vw,52px)/1 var(--display)}
.l-front .ph{padding:12px;background:var(--paper-2);color:var(--ink);justify-content:flex-end}
.l-front .ph i{font:italic 400 18px/1.1 var(--display)}
.cap-front{position:absolute;left:0;right:0;bottom:-30px;text-align:center;font:italic 400 14px/1 var(--display);color:var(--ink)}
.layer.has-img .ph{opacity:0;transition:opacity .4s}
.l-back.has-img img{filter:grayscale(1) contrast(1.15) brightness(.9)}
.l-mid.has-img img{filter:grayscale(1) contrast(1.2)}
.l-mid.has-img::after{content:"";position:absolute;inset:0;background:var(--red);mix-blend-mode:multiply;opacity:.85}
.l-mid.has-img .ph{opacity:1}
.l-mid.has-img .ph .label{color:#fff}
.reveal{animation:reveal 1.1s var(--ease) both}
@keyframes reveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
.drop{animation:drop .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{opacity:0;translate:0 -60px;scale:1.15}to{opacity:1;translate:0 0;scale:1}}
.swap{position:absolute;z-index:6;left:10px;top:10px;font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:8px 10px;background:#fff;color:var(--ink);cursor:pointer;opacity:0;transition:opacity .25s}
.layer:hover .swap,.swap:focus-within{opacity:1}
.swap input{position:absolute;opacity:0;width:1px;height:1px}
.dragging{outline:2px dashed var(--red);outline-offset:-8px}
.flash{position:absolute;z-index:8;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff 0,rgba(255,255,255,.95) 12%,rgba(255,255,255,.35) 32%,rgba(255,255,255,0) 62%);animation:pop .7s ease-out forwards;mix-blend-mode:screen}
.flash::after{content:"";position:absolute;left:50%;top:50%;width:300px;height:2px;margin:-1px 0 0 -150px;background:linear-gradient(90deg,transparent,#fff,transparent)}
@keyframes pop{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.spot{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.18),transparent 70%);mix-blend-mode:soft-light}

/* sections */
.rule{border:0;border-top:1px solid var(--ink);margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-h h2{margin:8px 0 0;font:400 clamp(36px,5vw,60px)/1 var(--display);letter-spacing:-.02em}
.sec-h h2 em{color:var(--red)}
.book{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px;padding-block:64px;align-items:start}
.block+.block{margin-top:34px;padding-top:30px;border-top:1px solid var(--line)}
.block h3{margin:0 0 14px;font:500 12px/16px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--grey)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;min-width:84px;padding:12px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:left;cursor:pointer;font:400 22px/1 var(--display);transition:border-color .2s,background .3s,color .3s,transform .2s}
.chip small{display:block;margin-top:6px;font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--grey);transition:color .3s}
.chip:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] small{color:#fff}
.chip:disabled{color:var(--grey);cursor:not-allowed;background:repeating-linear-gradient(-45deg,var(--paper),var(--paper) 6px,var(--paper-2) 6px,var(--paper-2) 12px)}
.screen{margin:0 auto 6px;width:84%;height:22px;border-top:3px solid var(--ink);border-radius:50% 50% 0 0/100% 100% 0 0}
.screen+p{text-align:center;margin:0 0 10px}
.seats-wrap{overflow-x:auto;padding-block:6px 12px}
.seats{display:grid;grid-template-columns:18px repeat(6,28px) 18px repeat(6,28px) 18px;gap:6px;justify-content:center;min-width:max-content;font:500 11px/1 var(--sans);color:var(--grey)}
.seats>span{display:grid;place-items:center}
.seat{width:28px;height:26px;padding:0;border:1px solid var(--ink);border-radius:8px 8px 3px 3px;background:var(--paper);cursor:pointer;transition:transform .15s,background .2s}
.seat:hover:not(:disabled){transform:translateY(-3px);background:var(--paper-2)}
.seat[aria-pressed="true"]{background:var(--red);border-color:var(--red);animation:seatpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes seatpop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.seat:disabled{border-color:var(--line);background:var(--paper-2);cursor:not-allowed}
.legend{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;font:500 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.legend i{display:inline-block;width:12px;height:11px;margin-right:8px;vertical-align:-1px;border:1px solid var(--ink);border-radius:4px 4px 2px 2px}
.legend .s{background:var(--red);border-color:var(--red)}
.legend .o{background:var(--paper-2);border-color:var(--line)}
.qty{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.qty:last-child{border-bottom:0}
.qty p{margin:0;font:400 22px/1.1 var(--display)}
.qty p small{display:block;margin-top:4px;font:400 13px/1.3 var(--sans);color:var(--grey)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;font:400 20px/1 var(--sans);transition:background .2s,color .2s}
.stepper button:hover:not(:disabled){background:var(--ink);color:#fff}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper output{min-width:2.4ch;text-align:center;font:400 24px/1 var(--display)}

.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);background:var(--ink);color:#fff;padding:30px}
.summary .label{color:#bdb6b6}
.summary h3{margin:10px 0 0;font:italic 400 30px/1.05 var(--display)}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;margin:24px 0;font-size:14px;line-height:1.4}
.summary dt{color:#bdb6b6}
.summary dd{margin:0;text-align:right;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #3a3636;padding-top:18px;margin-bottom:22px}
.total b{font:400 44px/1 var(--display)}
.summary .btn{width:100%}
.summary .btn--red::before{background:#fff}
.summary .btn--red:hover{color:var(--ink)}
.hint{margin:14px 0 0;font-size:13px;color:#bdb6b6}

/* ticket stub */
.stub{position:relative;margin-top:22px;background:#fff;color:var(--ink);display:grid;grid-template-columns:1fr auto;animation:print .9s var(--ease) both;transform-origin:top center}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-14px) rotate(-2deg)}to{clip-path:inset(0);transform:none}}
.stub>div{padding:18px}
.stub .main{border-right:2px dashed var(--line)}
.stub .main i{display:block;font:italic 400 22px/1.05 var(--display);color:var(--red);margin:6px 0 10px}
.stub .main p{margin:0;font-size:13px;line-height:1.5}
.stub .side{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;writing-mode:vertical-rl;font:500 12px/1 var(--sans);letter-spacing:.2em}
.stub .side b{font:400 20px/1 var(--display);letter-spacing:.06em;color:var(--red)}
.stub::before,.stub::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--ink);right:calc(var(--sw,74px) - 9px)}
.stub::before{top:-9px}.stub::after{bottom:-9px}

/* cast */
.cast{padding-block:64px}
.cast ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.cast li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:baseline;padding-block:16px;border-bottom:1px solid var(--line);cursor:default;position:relative}
.cast li b{font:400 clamp(26px,3.6vw,44px)/1.05 var(--display);transition:transform .45s var(--ease),color .3s}
.cast li span{font:500 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--grey);text-align:right}
.cast li:hover b{transform:translateX(18px);color:var(--red);font-style:italic}
footer{padding-block:28px 40px;border-top:1px solid var(--ink);font-size:13px;color:var(--grey)}

/* scroll reveal: visible at rest, slides only when JS marks it */
.rv.in{animation:rise .9s var(--ease) both}
@keyframes rise{from{transform:translateY(24px)}to{transform:none}}

@media (max-width:880px){
  .hero,.book{grid-template-columns:minmax(0,1fr)}
  .stack{margin-bottom:40px}
  .summary{position:static}
}
@media (max-width:520px){.nav nav{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .title.pre .ch{transform:none;opacity:1}
}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const html = htm.bind(React.createElement);
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const brl = c => 'R$ ' + (c / 100).toFixed(2).replace('.', ',');
const pad = n => String(n).padStart(2, '0');
const WD = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const TIMES = [['13:30', 'Legendado'], ['16:10', 'Dublado'], ['18:50', 'Legendado'], ['21:30', 'Legendado']];
const ROWS = 'ABCDEFGH'.split('');
const PRICE = { full: 3800, half: 1900 }, FEE = 300;

/* ---------- hooks ---------- */
function useSpringPointer(ref) {
  useEffect(() => {
    const el = ref.current; if (!el || REDUCE) return;
    let tx = 0, ty = 0, x = 0, y = 0, raf;
    const move = e => {
      const r = el.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width - .5; ty = (e.clientY - r.top) / r.height - .5;
      el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px');
    };
    const leave = () => { tx = 0; ty = 0; };
    const loop = () => {
      x += (tx - x) * .08; y += (ty - y) * .08;
      el.style.setProperty('--sx', x.toFixed(4)); el.style.setProperty('--sy', y.toFixed(4));
      raf = requestAnimationFrame(loop);
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerleave', leave); loop();
    return () => { cancelAnimationFrame(raf); el.removeEventListener('pointermove', move); el.removeEventListener('pointerleave', leave); };
  }, []);
}
function useTween(value, ms = 500) {
  const [v, setV] = useState(value); const from = useRef(value);
  useEffect(() => {
    if (REDUCE) { setV(value); from.current = value; return; }
    const a = from.current, t0 = performance.now(); let raf;
    const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); const cur = Math.round(a + (value - a) * e); setV(cur); from.current = cur; if (k < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
  }, [value]);
  return v;
}
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el || REDUCE || !('IntersectionObserver' in window)) return;
    const r = el.getBoundingClientRect(); if (r.top < innerHeight) return; // already in the first frame: leave visible
    const io = new IntersectionObserver(([en]) => { if (en.isIntersecting) { el.classList.add('in'); io.disconnect(); } }, { threshold: .12 });
    io.observe(el); return () => io.disconnect();
  }, []);
  return ref;
}

/* ---------- hero ---------- */
function KineticTitle() {
  const [pre, setPre] = useState(!REDUCE);
  useEffect(() => { const t = requestAnimationFrame(() => setPre(false)); return () => cancelAnimationFrame(t); }, []);
  let i = 0;
  const word = (w, em) => html`<span class="w">${[...w].map(c => { const d = (i++) * 32; return html`<span class="ch" style=${{ transitionDelay: d + 'ms' }}>${em ? html`<em>${c}</em>` : c}</span>`; })}</span>`;
  return html`<h1 class="title ${pre ? 'pre' : ''}" aria-label="O Diabo Veste Prada 2">
    <span aria-hidden="true">${word('O')}${word('Diabo')}<br/>${word('Veste')}${word('Prada', true)}</span></h1>`;
}

function Layer({ cls, anim, delay, img, onImg, children, label }) {
  const [over, setOver] = useState(false);
  const read = f => { if (!f || !/^image\//.test(f.type)) return; const r = new FileReader(); r.onload = () => onImg(r.result); r.readAsDataURL(f); };
  return html`<figure class="layer ${cls} ${anim} ${img ? 'has-img' : ''} ${over ? 'dragging' : ''}" style=${{ margin: 0, animationDelay: delay }}
      onDragOver=${e => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)}
      onDrop=${e => { e.preventDefault(); setOver(false); read(e.dataTransfer.files[0]); }}>
    ${img && html`<img src=${img} alt="" />`}
    ${children}
    <label class="swap">${label}<input type="file" accept="image/*" onChange=${e => read(e.target.files[0])} /></label>
  </figure>`;
}

function Flashes({ burst }) {
  const [list, setList] = useState([]);
  const fire = useCallback((n = 1) => {
    if (REDUCE) return;
    const add = Array.from({ length: n }, () => ({ id: Math.random(), x: 10 + Math.random() * 80, y: 8 + Math.random() * 70, s: .6 + Math.random() * .7 }));
    setList(l => [...l, ...add]);
    setTimeout(() => setList(l => l.filter(f => !add.includes(f))), 750);
  }, []);
  useEffect(() => {
    if (REDUCE) return;
    let t; const tickF = () => { fire(Math.random() < .35 ? 2 : 1); t = setTimeout(tickF, 1400 + Math.random() * 2600); };
    t = setTimeout(() => { fire(3); tickF(); }, 1500);
    return () => clearTimeout(t);
  }, []);
  useEffect(() => { if (burst) { fire(2); setTimeout(() => fire(2), 140); } }, [burst]);
  return list.map(f => html`<span key=${f.id} class="flash" style=${{ left: f.x + '%', top: f.y + '%', transform: `scale(${f.s})` }}></span>`);
}

function Stack() {
  const ref = useRef(null); useSpringPointer(ref);
  const [imgs, setImgs] = useState({}); const [burst, setBurst] = useState(0);
  const set = k => src => { setImgs(m => ({ ...m, [k]: src })); setBurst(b => b + 1); };
  return html`<div class="stack" ref=${ref} aria-label="Imagens do filme; passe o mouse para trocar cada uma">
    <${Layer} cls="l-back" anim="reveal" delay=".15s" img=${imgs.back} onImg=${set('back')} label="Trocar imagem">
      <div class="ph"><span class="label" style=${{ color: '#bdb6b6' }}>Edição de setembro</span><span class="mast">Runway</span></div>
    <//>
    <div class="layer l-num reveal" style=${{ animationDelay: '.45s' }} aria-hidden="true">2</div>
    <${Layer} cls="l-mid" anim="reveal" delay=".6s" img=${imgs.mid} onImg=${set('mid')} label="Trocar imagem">
      <div class="ph"><span class="label" style=${{ color: '#fff' }}>Somente nos cinemas</span><b>30 de abril</b></div>
    <//>
    <${Layer} cls="l-front" anim="drop" delay="1s" img=${imgs.front} onImg=${set('front')} label="Trocar">
      <div class="ph"><i>Miranda está de volta.</i></div>
    <//>
    <div class="spot"></div>
    <${Flashes} burst=${burst} />
  </div>`;
}

/* ---------- booking ---------- */
function seeded(n) { const x = Math.sin(n) * 10000; return x - Math.floor(x); }

function Booking() {
  const now = useMemo(() => new Date(), []);
  const days = useMemo(() => Array.from({ length: 5 }, (_, i) => { const d = new Date(now); d.setDate(now.getDate() + i); return d; }), []);
  const soldOut = (di, ti) => di === 0 && ti === 0 && now.getHours() >= 13;
  const [day, setDay] = useState(0);
  const [time, setTime] = useState(2);
  const taken = (ri, c) => seeded((day + 1) * 97 + (time + 1) * 31 + ri * 13 + c) < (ri < 3 ? .18 : .42);
  const initial = useMemo(() => ['E6', 'E7', 'E8'].filter(id => !taken(4, +id.slice(1))), []);
  const [seats, setSeats] = useState(initial);
  const [half, setHalf] = useState(initial.length > 1 ? 1 : 0);
  const [ticket, setTicket] = useState(null);
  const n = seats.length, full = n - half;
  const total = full * PRICE.full + half * PRICE.half + n * FEE;
  const shown = useTween(total);
  const d = days[day];
  const when = `${day === 0 ? 'Hoje' : WD[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)} · ${TIMES[time][0]}`;

  const reset = () => { setSeats([]); setHalf(0); setTicket(null); };
  const toggle = id => { setTicket(null); setSeats(s => { const k = s.indexOf(id); const next = k > -1 ? s.filter(x => x !== id) : s.length < 6 ? [...s, id] : s; setHalf(h => Math.min(h, next.length)); return next; }); };

  return html`<section class="book" id="sessoes">
    <div ref=${useReveal()} class="rv">
      <div class="sec-h"><div><p class="label">Ingressos · Sala 3</p><h2>Escolha seu <em>lugar</em></h2></div></div>
      <div class="block"><h3>Dia</h3><div class="chips">
        ${days.map((dd, i) => html`<button key=${i} type="button" class="chip num" aria-pressed=${i === day} onClick=${() => { setDay(i); if (soldOut(i, time)) setTime(1); reset(); }}>
          ${pad(dd.getDate())}<small>${i === 0 ? 'Hoje' : WD[dd.getDay()]}</small></button>`)}
      </div></div>
      <div class="block"><h3>Sessão</h3><div class="chips">
        ${TIMES.map((t, i) => html`<button key=${i} type="button" class="chip num" aria-pressed=${i === time} disabled=${soldOut(day, i)} onClick=${() => { setTime(i); reset(); }}>
          ${t[0]}<small>${soldOut(day, i) ? 'Esgotada' : t[1]}</small></button>`)}
      </div></div>
      <div class="block"><h3>Lugares · até 6</h3>
        <div class="screen"></div><p class="label">Tela</p>
        <div class="seats-wrap"><div class="seats" role="group" aria-label="Mapa de assentos">
          ${ROWS.map((r, ri) => html`<${React.Fragment} key=${r}>
            <span>${r}</span>
            ${Array.from({ length: 12 }, (_, k) => { const c = k + 1, id = r + c; return html`<${React.Fragment} key=${id}>
              ${c === 7 && html`<span></span>`}
              <button type="button" class="seat" title=${id} aria-label=${'Assento ' + id} disabled=${taken(ri, c)} aria-pressed=${seats.includes(id)} onClick=${() => toggle(id)}></button>
            <//>`; })}
            <span>${r}</span>
          <//>`)}
        </div></div>
        <div class="legend"><span><i></i>Livre</span><span><i class="s"></i>Seu lugar</span><span><i class="o"></i>Ocupado</span></div>
      </div>
      <div class="block"><h3>Tipo de ingresso</h3>
        <div class="qty"><p>Inteira<small class="num">${brl(PRICE.full)}</small></p>
          <div class="stepper"><button type="button" aria-label="Menos inteira" disabled=${full === 0} onClick=${() => setHalf(h => h + 1)}>−</button><output class="num">${full}</output><button type="button" aria-label="Mais inteira" disabled=${half === 0} onClick=${() => setHalf(h => h - 1)}>+</button></div></div>
        <div class="qty"><p>Meia-entrada<small>Estudante, idoso, PcD · <span class="num">${brl(PRICE.half)}</span></small></p>
          <div class="stepper"><button type="button" aria-label="Menos meia" disabled=${half === 0} onClick=${() => setHalf(h => h - 1)}>−</button><output class="num">${half}</output><button type="button" aria-label="Mais meia" disabled=${half === n} onClick=${() => setHalf(h => h + 1)}>+</button></div></div>
      </div>
    </div>

    <aside class="summary" aria-live="polite">
      <p class="label">Seu pedido</p>
      <h3>O Diabo Veste Prada 2</h3>
      <dl class="num">
        <dt>Sessão</dt><dd>${when} · ${TIMES[time][1]}</dd>
        <dt>Lugares</dt><dd>${n ? [...seats].sort().join(', ') : '—'}</dd>
        <dt>Ingressos</dt><dd>${n ? `${full} inteira${full === 1 ? '' : 's'} · ${half} meia${half === 1 ? '' : 's'}` : '—'}</dd>
        <dt>Taxa de serviço</dt><dd>${brl(n * FEE)}</dd>
      </dl>
      <div class="total"><span class="label">Total</span><b class="num">${brl(shown)}</b></div>
      <button type="button" class="btn btn--red" disabled=${!n} onClick=${() => setTicket('PRD-' + Math.random().toString(36).slice(2, 7).toUpperCase())}>Reservar lugares</button>
      <p class="hint">${n ? 'Reserva válida por 10 minutos. Página de teste: nada é cobrado.' : 'Toque nas poltronas para escolher seus lugares.'}</p>
      ${ticket && html`<div class="stub" key=${ticket}>
        <div class="main"><span class="label">Sala 3 · ${when}</span><i>O Diabo Veste Prada 2</i><p class="num">Lugares ${[...seats].sort().join(', ')}<br/>${full} inteira · ${half} meia · ${brl(total)}</p></div>
        <div class="side"><span>ADMIT</span><b>${ticket}</b></div>
      </div>`}
    </aside>
  </section>`;
}

/* ---------- page ---------- */
const CAST = [['Meryl Streep', 'Miranda Priestly'], ['Anne Hathaway', 'Andy Sachs'], ['Emily Blunt', 'Emily Charlton'], ['Stanley Tucci', 'Nigel Kipling'], ['Kenneth Branagh', 'Elenco'], ['Lucy Liu', 'Elenco'], ['Justin Theroux', 'Elenco'], ['Simone Ashley', 'Elenco']];
const TICK = ['Pré-venda aberta', 'Legendado e dublado', '30 de abril nos cinemas', 'Classificação 12 anos', '119 minutos', 'Direção David Frankel'];

function App() {
  const castRef = useReveal();
  return html`<div class="wrap">
    <header class="nav"><span class="brand">Cinema Teste</span>
      <nav aria-label="Principal"><a href="#sessoes">Sessões</a><a href="#elenco">Elenco</a></nav>
      <a class="btn" href="#sessoes" style=${{ padding: '12px 18px' }}>Comprar</a></header>
    <div class="ticker" aria-hidden="true"><div>${[...TICK, ...TICK].map((t, i) => html`<span key=${i}>${t}</span>`)}</div></div>

    <section class="hero">
      <div>
        <p class="label">Em cartaz · Sessões hoje</p>
        <${KineticTitle} />
        <p class="lead">Miranda Priestly, Andy Sachs, Emily e Nigel voltam à Runway, agora com a revista em crise e uma rival de luxo no caminho.</p>
        <ul class="facts num"><li>12 anos</li><li>119 min</li><li>Comédia</li></ul>
        <div class="cta"><a class="btn btn--red" href="#sessoes">Comprar ingressos</a><a class="btn" href="#elenco">Elenco</a></div>
      </div>
      <${Stack} />
    </section>

    <hr class="rule" />
    <${Booking} />
    <hr class="rule" />

    <section class="cast rv" id="elenco" ref=${castRef}>
      <div class="sec-h"><div><p class="label">Elenco</p><h2>De volta à <em>Runway</em></h2></div></div>
      <ol>${CAST.map(([a, r]) => html`<li key=${a}><b>${a}</b><span>${r}</span></li>`)}</ol>
    </section>
    <footer>Página de teste. Cinema, sessões e preços são fictícios; nenhuma cobrança é feita.</footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
